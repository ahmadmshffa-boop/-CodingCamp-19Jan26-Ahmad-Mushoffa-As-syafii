<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>To-Do List App</h1>
    <div class="input-section">
        <input type="text" id="filter-input" placeholder="Cari tugas...">
    </div>
    <div class="input-section">
        <input type="text" id="task-input" placeholder="Masukkan nama tugas">
        <button id="add-btn">Tambah Tugas</button>
        
    </div>
    <button id="delete-all-btn" style="width:100%; margin-bottom:15px; background:#dc3545; color:white; padding:10px; border:none; border-radius:5px; cursor:pointer;">
    Hapus Semua
    </button>

    <ul id="task-list" class="task-list"></ul>
    <div class="counters">
        <p class="count">Total Tugas: <span id="total-count">0</span></p>
        <p class="done">Tugas Selesai: <span id="completed-count">0</span></p>
    </div>

    <script src="index.js"> </script>

    <footer class="bawah">© 2026 coding camp 19 jan 2026 </footer>
</body>
</html>
